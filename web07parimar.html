<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo: número par o impar</title>
    <script>
        function evaluarNumero() {
            // Número que se va a evaluar.
            const numero = 14;

            if (numero % 2 === 0) {
                alert("El número es par");
            } else {
                alert("El número es impar");
            }
        }
    </script>
</head>
<body>
    <h1>Ejemplo par/impar</h1>
    <button type="button" onclick="evaluarNumero()">Evaluar</button>
</body>
</html>
