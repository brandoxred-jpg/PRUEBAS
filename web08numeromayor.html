<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo: número mayor</title>
    <script>
        function compararNumeros() {
            const entrada1 = document.getElementById("numero1");
            const entrada2 = document.getElementById("numero2");
            const resultado = document.getElementById("resultado");
            const numero1 = entrada1.valueAsNumber;
            const numero2 = entrada2.valueAsNumber;

            if (entrada1.value === "" || entrada2.value === "" ||
                !Number.isFinite(numero1) || !Number.isFinite(numero2)) {
                resultado.textContent = "Introduce los dos números para compararlos.";
            } else if (numero1 === numero2) {
                resultado.textContent = "Los dos números son iguales: " + numero1;
            } else {
                const mayor = numero1 > numero2 ? numero1 : numero2;
                const menor = numero1 < numero2 ? numero1 : numero2;
                resultado.textContent = "El número mayor es: " + mayor +
                    ". El número menor es: " + menor + ".";
            }
        }
    </script>
</head>
<body>
    <h1>Ejemplo: número mayor</h1>
    <label for="numero1">Primer número:</label>
    <input type="number" id="numero1" step="any">
    <label for="numero2">Segundo número:</label>
    <input type="number" id="numero2" step="any">
    <button type="button" onclick="compararNumeros()">Comparar números</button>
    <p id="resultado" aria-live="polite"></p>
</body>
</html>
