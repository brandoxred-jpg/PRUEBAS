<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            background: #f3f6fb;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(100%, 540px);
            margin: 0 auto;
            padding: 2rem;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(31, 41, 55, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #173b70;
        }

        .intro {
            margin-bottom: 1.5rem;
            color: #526174;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 1.1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        input,
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
            outline: 2px solid rgba(37, 99, 235, 0.18);
        }

        .number-input {
            display: flex;
            gap: 0.5rem;
        }

        .number-input select {
            flex: 0 0 90px;
        }

        .number-input input {
            min-width: 0;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main>
        <h1>Formulario</h1>
        <p class="intro">Completa tus datos:</p>
        <form>
            <div class="field">
                <label for="nombre">Nombre</label>
                <input id="nombre" name="nombre" type="text" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="numero">Número de documento</label>
                <div class="number-input">
                    <select id="tipo-documento" name="tipo_documento" aria-label="Tipo de documento" required>
                        <option value="DNI">DNI</option>
                        <option value="NIE">NIE</option>
                    </select>
                    <input id="numero" name="numero" type="text" placeholder="Introduce el número" autocomplete="off" required>
                </div>
            </div>
            <div class="field">
                <label for="fecha">Fecha</label>
                <input id="fecha" name="fecha" type="date" required>
            </div>
            <div class="field">
                <label for="lugar">Provincia o ciudad autónoma</label>
                <select id="lugar" name="lugar" required>
                    <option value="" disabled selected>Elige una provincia</option>
                    <optgroup label="Andalucía">
                        <option value="Almería">Almería</option>
                        <option value="Cádiz">Cádiz</option>
                        <option value="Córdoba">Córdoba</option>
                        <option value="Granada">Granada</option>
                        <option value="Huelva">Huelva</option>
                        <option value="Jaén">Jaén</option>
                        <option value="Málaga">Málaga</option>
                        <option value="Sevilla">Sevilla</option>
                    </optgroup>
                    <optgroup label="Aragón">
                        <option value="Huesca">Huesca</option>
                        <option value="Teruel">Teruel</option>
                        <option value="Zaragoza">Zaragoza</option>
                    </optgroup>
                    <optgroup label="Principado de Asturias">
                        <option value="Asturias">Asturias</option>
                    </optgroup>
                    <optgroup label="Illes Balears">
                        <option value="Illes Balears">Illes Balears</option>
                    </optgroup>
                    <optgroup label="Canarias">
                        <option value="Las Palmas">Las Palmas</option>
                        <option value="Santa Cruz de Tenerife">Santa Cruz de Tenerife</option>
                    </optgroup>
                    <optgroup label="Cantabria">
                        <option value="Cantabria">Cantabria</option>
                    </optgroup>
                    <optgroup label="Castilla-La Mancha">
                        <option value="Albacete">Albacete</option>
                        <option value="Ciudad Real">Ciudad Real</option>
                        <option value="Cuenca">Cuenca</option>
                        <option value="Guadalajara">Guadalajara</option>
                        <option value="Toledo">Toledo</option>
                    </optgroup>
                    <optgroup label="Castilla y León">
                        <option value="Ávila">Ávila</option>
                        <option value="Burgos">Burgos</option>
                        <option value="León">León</option>
                        <option value="Palencia">Palencia</option>
                        <option value="Salamanca">Salamanca</option>
                        <option value="Segovia">Segovia</option>
                        <option value="Soria">Soria</option>
                        <option value="Valladolid">Valladolid</option>
                        <option value="Zamora">Zamora</option>
                    </optgroup>
                    <optgroup label="Cataluña">
                        <option value="Barcelona">Barcelona</option>
                        <option value="Girona">Girona</option>
                        <option value="Lleida">Lleida</option>
                        <option value="Tarragona">Tarragona</option>
                    </optgroup>
                    <optgroup label="Comunitat Valenciana">
                        <option value="Alicante/Alacant">Alicante/Alacant</option>
                        <option value="Castellón/Castelló">Castellón/Castelló</option>
                        <option value="Valencia/València">Valencia/València</option>
                    </optgroup>
                    <optgroup label="Extremadura">
                        <option value="Badajoz">Badajoz</option>
                        <option value="Cáceres">Cáceres</option>
                    </optgroup>
                    <optgroup label="Galicia">
                        <option value="A Coruña">A Coruña</option>
                        <option value="Lugo">Lugo</option>
                        <option value="Ourense">Ourense</option>
                        <option value="Pontevedra">Pontevedra</option>
                    </optgroup>
                    <optgroup label="Comunidad de Madrid">
                        <option value="Madrid">Madrid</option>
                    </optgroup>
                    <optgroup label="Región de Murcia">
                        <option value="Murcia">Murcia</option>
                    </optgroup>
                    <optgroup label="Comunidad Foral de Navarra">
                        <option value="Navarra">Navarra</option>
                    </optgroup>
                    <optgroup label="País Vasco">
                        <option value="Araba/Álava">Araba/Álava</option>
                        <option value="Bizkaia/Vizcaya">Bizkaia/Vizcaya</option>
                        <option value="Gipuzkoa/Guipúzcoa">Gipuzkoa/Guipúzcoa</option>
                    </optgroup>
                    <optgroup label="La Rioja">
                        <option value="La Rioja">La Rioja</option>
                    </optgroup>
                    <optgroup label="Ciudades autónomas">
                        <option value="Ceuta">Ceuta</option>
                        <option value="Melilla">Melilla</option>
                    </optgroup>
                </select>
            </div>
            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
